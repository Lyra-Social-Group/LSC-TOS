title: Lyra Social Group — Legal & Community Hub
description: Official Legal Terms, Privacy Disclosures, and Governance Documentation for LSG & LCH.
theme: minima

# Inject custom SCSS
sass:
  style: compressed

kramdown:
  input: GFM
  hard_wrap: false

header_pages:
  - README.md
  - tos/discord.md
  - tos/bot.md
  - tos/contributors.md
  - privacy/privacy-policy.md
  - privacy/data-retention.md
  - community/guidelines.md
  - community/moderation.md
  - community/appeals.md
  - community/events.md
  - community/verification.md
  - community/creators.md
  - governance/staff-code-of-conduct.md

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
